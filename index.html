<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Square to Square Adventure</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
}

/* UI */
#ui {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 22px;
}

/* MENU */
#menu {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 10;
}

#menu h1 {
    font-size: 50px;
}

#menu button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    cursor: pointer;
    background: cyan;
    color: black;
}

/* MOBILE CONTROLS */
#mobileControls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    display: none;
    z-index: 5;
}

#mobileControls button {
    font-size: 28px;
    padding: 15px;
    margin: 5px;
    background: cyan;
    border: none;
    border-radius: 10px;

    /* ✅ FIXES */
    -webkit-tap-highlight-color: transparent;
    outline: none;
    user-select: none;
}

/* ✅ Press animation */
#mobileControls button:active {
    transform: scale(0.9);
    background: #00aaaa;
}

/* Death screen */
#deathScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 20;
}

#deathScreen h1 {
    font-size: 60px;
    color: red;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
    <h1>Choose Your Setup</h1>

    <button onclick="chooseDevice('pc')">🖥 PC</button>
    <button onclick="chooseDevice('mobile')">📱 Mobile</button>

    <br>

    <button onclick="startGame(1)">🌌 World 1 (Classic)</button>
    <button onclick="startGame(2)">🔥 World 2 (Hard Mode)</button>
</div>

<div id="ui"></div>
<canvas id="game"></canvas>

<!-- MOBILE CONTROLS -->
<div id="mobileControls">
    <button id="up">⬆</button><br>
    <button id="left">⬅</button>
    <button id="down">⬇</button>
    <button id="right">➡</button>
</div>

<!-- DEATH SCREEN -->
<div id="deathScreen">
    <h1>💀 GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Sounds
const bgMusic = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_6c9a4bfa4c.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.3;

const deathSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_4a1b2b2f5c.mp3");
const levelUpSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_5c6d4f4c3a.mp3");

// STATE
let player, goal, enemies, particles, level, keys, gameRunning;
let world = 1;
let gameStarted = false;
let isMobile = false;

// HIGH SCORES
let highScores = {
    1: localStorage.getItem("neonHighScore1") || 1,
    2: localStorage.getItem("neonHighScore2") || 1
};

// RESIZE
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// DEVICE SELECT
function chooseDevice(type) {
    isMobile = (type === "mobile");

    if (isMobile) {
        document.getElementById("mobileControls").style.display = "block";
    }
}

// START GAME
function startGame(selectedWorld) {
    world = selectedWorld;
    document.getElementById("menu").style.display = "none";

    if (isMobile) bindMobileControls();

    init();
    gameStarted = true;
}

// INIT
function init() {
    player = { x: 50, y: 50, size: 20, speed: 4 };
    goal = { x: canvas.width - 80, y: canvas.height - 80, size: 25 };
    enemies = [];
    particles = [];
    level = 1;
    keys = {};
    gameRunning = true;

    bgMusic.currentTime = 0;
    bgMusic.play();

    spawnEnemies();
}

// KEYBOARD
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// MOBILE CONTROLS
function bindMobileControls() {
    const map = {
        up: "ArrowUp",
        down: "ArrowDown",
        left: "ArrowLeft",
        right: "ArrowRight"
    };

    Object.keys(map).forEach(id => {
        const key = map[id];
        const btn = document.getElementById(id);

        btn.addEventListener("touchstart", () => keys[key] = true);
        btn.addEventListener("touchend", () => keys[key] = false);

        // ✅ FIX: prevents stuck movement
        btn.addEventListener("touchcancel", () => keys[key] = false);
        btn.addEventListener("mouseleave", () => keys[key] = false);

        btn.addEventListener("mousedown", () => keys[key] = true);
        btn.addEventListener("mouseup", () => keys[key] = false);
    });
}

// ENEMIES
function spawnEnemies() {
    enemies = [];
    const MIN_DISTANCE = 200;

    for (let i = 0; i < level; i++) {
        let x, y, dist;

        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
            dist = Math.hypot(player.x - x, player.y - y);
        } while (dist < MIN_DISTANCE);

        enemies.push({
            x,
            y,
            size: world === 1 ? 20 : 25,
            speed: (2 + level * 0.3) * (world === 2 ? 1.5 : 1),
            dirX: Math.random() > 0.5 ? 1 : -1,
            dirY: Math.random() > 0.5 ? 1 : -1
        });
    }
}

// UPDATE
function update() {
    if (!gameRunning) return;

    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    if (keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["ArrowRight"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    particles.push({
        x: player.x + player.size/2,
        y: player.y + player.size/2,
        life: 20
    });

    particles = particles.filter(p => --p.life > 0);

    enemies.forEach(e => {
        e.x += e.speed * e.dirX;
        e.y += e.speed * e.dirY;

        if (e.x <= 0 || e.x >= canvas.width - e.size) e.dirX *= -1;
        if (e.y <= 0 || e.y >= canvas.height - e.size) e.dirY *= -1;

        if (collision(player, e)) showDeath();
    });

    if (collision(player, goal)) {
        level++;
        levelUpSound.play();
        resetPlayer();
        spawnEnemies();
    }
}

// DEATH
function showDeath() {
    gameRunning = false;

    deathSound.play();
    bgMusic.pause();

    if (level > highScores[world]) {
        highScores[world] = level;
        localStorage.setItem("neonHighScore" + world, level);
    }

    document.getElementById("finalScore").textContent =
        "Level: " + level + " | World " + world + " High Score: " + highScores[world];

    setTimeout(() => {
        document.getElementById("deathScreen").style.display = "flex";
    }, 300);
}

// RESTART
function restartGame() {
    document.getElementById("deathScreen").style.display = "none";
    init();
}

// COLLISION
function collision(a, b) {
    return a.x < b.x + b.size &&
           a.x + a.size > b.x &&
           a.y < b.y + b.size &&
           a.y + a.size > b.y;
}

function resetPlayer() {
    player.x = 50;
    player.y = 50;
}

// DRAW
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    canvas.style.background = world === 1
        ? "radial-gradient(circle, #000 40%, #050505 100%)"
        : "radial-gradient(circle, #001a33 40%, #000 100%)";

    particles.forEach(p => {
        let color = world === 1 ? "0,255,255" : "80,200,255";
        ctx.fillStyle = `rgba(${color},${p.life/20})`;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    ctx.fillStyle = world === 1 ? "cyan" : "#4da6ff";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    ctx.fillStyle = world === 1 ? "lime" : "#00ffd5";
    ctx.fillRect(goal.x, goal.y, goal.size, goal.size);

    enemies.forEach(e => {
        ctx.fillStyle = world === 1 ? "red" : "#ff3bff";
        ctx.fillRect(e.x, e.y, e.size, e.size);
    });

    document.getElementById("ui").textContent =
        "World: " + world + " | Level: " + level + " | High Score: " + highScores[world];
}

// LOOP
function gameLoop() {
    if (gameStarted) {
        update();
        draw();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
