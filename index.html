<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Square to Square Adventure</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
    color: white;
}

canvas {
    display: block;
}

/* UI */
#ui {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 22px;
}

/* MENU */
#menu {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 25px;
    z-index: 10;
}

#menu h1 {
    font-size: 50px;
}

#menu button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    cursor: pointer;
    background: cyan;
    color: black;
}

/* Death screen */
#deathScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#deathScreen h1 {
    font-size: 60px;
    color: red;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
    <h1>Choose Your World</h1>
    <button onclick="startGame(1)">🌌 World 1 (Classic)</button>
    <button onclick="startGame(2)">🔥 World 2 (Hard Mode)</button>
</div>

<div id="ui"></div>
<canvas id="game"></canvas>

<!-- DEATH SCREEN -->
<div id="deathScreen">
    <h1>💀 GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Sounds
const bgMusic = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_6c9a4bfa4c.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.3;

const deathSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_4a1b2b2f5c.mp3");
const levelUpSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_5c6d4f4c3a.mp3");

// Game state
let player, goal, enemies, particles, level, keys, gameRunning;
let world = 1;
let gameStarted = false;

// ✅ Separate high scores
let highScores = {
    1: localStorage.getItem("neonHighScore1") || 1,
    2: localStorage.getItem("neonHighScore2") || 1
};

// Resize
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// START GAME
function startGame(selectedWorld) {
    world = selectedWorld;
    document.getElementById("menu").style.display = "none";

    init();
    gameStarted = true;
}

// INIT
function init() {
    player = { x: 50, y: 50, size: 20, speed: 4 };
    goal = { x: canvas.width - 80, y: canvas.height - 80, size: 25 };
    enemies = [];
    particles = [];
    level = 1;
    keys = {};
    gameRunning = true;

    bgMusic.currentTime = 0;
    bgMusic.play();

    spawnEnemies();
}

// CONTROLS
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// ENEMIES
function spawnEnemies() {
    enemies = [];
    const MIN_DISTANCE = 200;

    for (let i = 0; i < level; i++) {
        let x, y, dist;

        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
            dist = Math.hypot(player.x - x, player.y - y);
        } while (dist < MIN_DISTANCE);

        enemies.push({
            x,
            y,
            size: world === 1 ? 20 : 25,
            speed: (2 + level * 0.3) * (world === 2 ? 1.5 : 1),
            dirX: Math.random() > 0.5 ? 1 : -1,
            dirY: Math.random() > 0.5 ? 1 : -1
        });
    }
}

// UPDATE
function update() {
    if (!gameRunning || !player) return;

    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    if (keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["ArrowRight"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    // particles
    particles.push({
        x: player.x + player.size/2,
        y: player.y + player.size/2,
        life: 20
    });

    particles.forEach(p => p.life--);
    particles = particles.filter(p => p.life > 0);

    // enemies
    enemies.forEach(e => {
        e.x += e.speed * e.dirX;
        e.y += e.speed * e.dirY;

        if (e.x <= 0 || e.x >= canvas.width - e.size) e.dirX *= -1;
        if (e.y <= 0 || e.y >= canvas.height - e.size) e.dirY *= -1;

        if (collision(player, e)) showDeath();
    });

    // goal
    if (collision(player, goal)) {
        level++;
        levelUpSound.play();
        resetPlayer();
        spawnEnemies();
    }
}

// DEATH
function showDeath() {
    gameRunning = false;

    deathSound.play();
    bgMusic.pause();

    // ✅ Separate high score logic
    if (level > highScores[world]) {
        highScores[world] = level;
        localStorage.setItem("neonHighScore" + world, level);
    }

    document.getElementById("finalScore").textContent =
        "Level: " + level + " | World " + world + " High Score: " + highScores[world];

    setTimeout(() => {
        document.getElementById("deathScreen").style.display = "flex";
    }, 300);
}

// RESTART
function restartGame() {
    document.getElementById("deathScreen").style.display = "none";
    init();
}

// COLLISION
function collision(a, b) {
    return a.x < b.x + b.size &&
           a.x + a.size > b.x &&
           a.y < b.y + b.size &&
           a.y + a.size > b.y;
}

function resetPlayer() {
    player.x = 50;
    player.y = 50;
}

// DRAW GLOW
function drawGlow(x, y, size, color) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
    ctx.shadowBlur = 0;
}

// DRAW
function draw() {
    if (!player) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // background
    if (world === 1) {
        canvas.style.background = "radial-gradient(circle, #000 40%, #050505 100%)";
    } else {
        canvas.style.background = "radial-gradient(circle, #200000 40%, #000 100%)";
    }

    // ✅ particles match world color
    particles.forEach(p => {
        let color = world === 1 ? "0,255,255" : "255,165,0";
        ctx.fillStyle = "rgba(" + color + "," + (p.life/20) + ")";
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    // player
    drawGlow(player.x, player.y, player.size, world === 1 ? "cyan" : "orange");

    // goal
    let pulse = Math.sin(Date.now() * 0.005) * 5;
    drawGlow(goal.x, goal.y, goal.size + pulse, world === 1 ? "lime" : "yellow");

    // enemies
    enemies.forEach(e =>
        drawGlow(e.x, e.y, e.size, world === 1 ? "red" : "magenta")
    );

    // ✅ UI uses correct high score
    document.getElementById("ui").textContent =
        "World: " + world + " | Level: " + level + " | High Score: " + highScores[world];
}

// LOOP
function gameLoop() {
    if (gameStarted) {
        update();
        draw();
    }
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
